name: Secret scan

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Scan tracked files for secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_pattern='-----BEGIN (RSA |DSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|github_pat_[A-Za-z0-9_]{50,}|gh[pousr]_[A-Za-z0-9]{36,}|xox[baprs]-[A-Za-z0-9-]{20,}|AIza[0-9A-Za-z_-]{35}|sk_live_[0-9A-Za-z]{20,}|sk-proj-[A-Za-z0-9_-]{40,}'
          if git grep -n -I -E "$secret_pattern" -- .; then
            echo "Potential secret content detected in tracked files." >&2
            exit 1
          fi
          env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(\.example|\.sample|\.template)$' || true)"
          key_files="$(git ls-files | grep -E '(^|/)(id_(rsa|dsa|ecdsa|ed25519)|[^/]*\.(pem|key|p8|p12|pfx|jks|keystore)|credentials\.json|service[-_]?account[^/]*\.json)$' || true)"
          sensitive_files="$(printf '%s\n%s\n' "$env_files" "$key_files" | sed '/^$/d')"
          if [[ -n "$sensitive_files" ]]; then
            printf 'Sensitive file is tracked:\n%s\n' "$sensitive_files" >&2
            exit 1
          fi
